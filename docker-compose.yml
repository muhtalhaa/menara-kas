services:
  db:
    image: postgres:16-alpine
    container_name: menara-kas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: menara_kas
    ports:
      - "5432:5432"
    volumes:
      - menara_kas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menara_kas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menara_kas_pgdata:
